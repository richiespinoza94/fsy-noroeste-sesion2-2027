<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reparto de Compañías — FSY 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#F5EFCA}
body{font-family:'Bricolage Grotesque',sans-serif;color:#000;cursor:pointer;user-select:none;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden}
.scene{position:absolute;inset:0;transition:opacity .45s ease}
.scene.leaving{opacity:0}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
.fade{animation:fade .7s ease var(--d,0s) both}
.pop{animation:pop .6s cubic-bezier(.3,1.4,.5,1) var(--d,0s) both}
.popdisc{animation:pop 1.1s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
.slide{animation:slide .9s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}

/* Intro */
.disc{position:absolute;right:-120px;top:50%;margin-top:-470px;width:940px;height:940px;border-radius:50%;background:#FFB81C;display:flex;flex-direction:column;align-items:center;justify-content:center}
.disc .fsy{font-size:340px;font-weight:800;line-height:.8;letter-spacing:-.05em}
.disc .year{font-size:96px;font-weight:700;letter-spacing:-.02em;margin-top:24px}
.intro-text{position:absolute;left:120px;top:0;bottom:170px;width:880px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#D45311}
.intro-title{font-size:176px;font-weight:800;line-height:.9;letter-spacing:-.04em;margin-top:28px}
.lema-row{display:flex;align-items:center;gap:24px;margin-top:56px}
.lema{padding:18px 36px;border-radius:999px;background:#000;color:#F5EFCA;font-size:44px;font-weight:700}
.cita{font-size:30px;font-weight:600}

/* Coordinadores */
.panel{position:absolute;left:0;top:0;bottom:0;width:780px;padding:110px 80px 170px;display:flex;flex-direction:column}
.panel .lbl{font-size:48px;font-weight:700}
.panel .num{font-size:760px;font-weight:800;line-height:.78;letter-spacing:-.06em;margin-top:auto}
.panel .sub{font-size:32px;font-weight:600;margin-top:24px}
.coord-col{position:absolute;left:780px;right:0;top:0;bottom:170px;padding:0 120px;display:flex;flex-direction:column;justify-content:center;gap:32px}
.label-caps{font-size:30px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.coord-card{background:#FFF;border-radius:44px;padding:40px 48px;display:flex;align-items:center;gap:40px;box-shadow:0 30px 60px -30px rgba(0,0,0,.25)}
.coord-card .ini{width:150px;height:150px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800}
.coord-card .first{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.coord-card .last{font-size:36px;font-weight:600;margin-top:10px}
.coord-card.empty{font-size:64px;font-weight:700;padding:48px}

/* Integrantes */
.members{position:absolute;inset:0;padding:88px 120px 170px;display:flex;flex-direction:column}
.m-head{display:flex;align-items:center;justify-content:space-between}
.m-head .left{display:flex;align-items:center;gap:28px}
.badge{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:88px;font-weight:800;letter-spacing:-.04em}
.m-title{font-size:112px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pill-outline{padding:16px 36px;border-radius:999px;border:3px solid #000;font-size:34px;font-weight:700;white-space:nowrap}
.grid{flex:1;display:grid;align-content:center;margin-top:36px}
.m-card{background:#FFF;border-radius:32px;padding-left:32px;padding-right:32px;min-width:0;position:relative;overflow:hidden}
.m-card .bar{position:absolute;left:0;top:0;bottom:0;width:12px}
.m-card .first{font-weight:800;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.m-card .last{font-weight:600;margin-top:8px}
.m-foot{display:flex;align-items:center;flex-wrap:wrap;gap:20px;font-size:28px}
.m-foot b{font-weight:700}
.chip{padding:8px 22px;border-radius:999px;font-weight:700;white-space:nowrap;flex:none}

/* Resumen */
.ov{position:absolute;inset:0;padding:88px 120px 170px;display:flex;flex-direction:column}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:40px}
.ov-title{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.btn{padding:18px 36px;border-radius:999px;background:#000;color:#F5EFCA;font-size:28px;font-weight:700;white-space:nowrap;border:0;font-family:inherit;cursor:pointer}
.btn:hover{background:#D45311;color:#000}
.ov-grid{flex:1;display:grid;gap:28px;margin-top:56px}
.ov-card{border-radius:44px;padding:44px;display:flex;flex-direction:column;min-width:0}
.ov-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ov-card .num{font-size:260px;font-weight:800;line-height:.78;letter-spacing:-.06em}
.ov-card .tot{font-size:26px;font-weight:700;padding:8px 20px;border-radius:999px;background:#FFF;white-space:nowrap}
.ov-card .name{font-size:52px;font-weight:800;letter-spacing:-.02em;margin-top:28px}
.ov-card .rule{height:3px;background:#000;margin:auto 0 24px;width:64px}
.ov-card .cl{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ov-card .cn{font-size:32px;font-weight:600;line-height:1.25}

/* Pie */
#footer{position:absolute;left:120px;right:120px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700;z-index:5}
#footer .right{display:flex;align-items:center;gap:24px}
#dots{display:flex;gap:8px;align-items:center}
#dots i{display:block;height:12px;width:12px;border-radius:6px;background:#000;opacity:.22;transition:width .5s cubic-bezier(.16,1,.3,1),opacity .3s}
#dots i.on{width:44px;opacity:1}
#pos{font-variant-numeric:tabular-nums}
#sound{display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;border:2px solid #000;background:transparent;font:inherit;font-size:20px;cursor:pointer;color:#000}
#sound .eq{display:flex;gap:3px;align-items:flex-end;height:18px}
#sound .eq span{width:4px;background:#000;height:6px;border-radius:2px}
#sound.playing .eq span{animation:eq .9s ease-in-out infinite}
#sound.playing .eq span:nth-child(2){animation-delay:.2s}
#sound.playing .eq span:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="footer">
      <div id="evento"></div>
      <div class="right">
        <button id="sound" type="button" title="Música (tecla M)"><span class="eq"><span></span><span></span><span></span></span><span id="soundLbl">Música</span></button>
        <div id="dots"></div>
        <div id="pos"></div>
      </div>
    </div>
  </div>
</div>
<audio id="bgm" src="__AUDIO_SRC__" loop preload="auto"></audio>

<script>
/* ===================== DATOS:INICIO =====================
   Única sección que la app debe reemplazar.
   nombres = nombres de pila; apellidos = paterno + materno.
   "color" es opcional: si falta se asigna por orden (ver PALETA_COMPANIAS). */
const EVENTO = {
  anio: "2027",
  zona: "Lima Noroeste",
  sesion: "Sesión 2",
  lema: "Regocíjate en Cristo",
  cita: "Filipenses 4:4"
};
const COMPANIAS = [
  { nombre: "Compañía 1",
    coords: [["Leonardo Moises","Quispe Sangama"],["Carmen Del Pilar","Cisneros Martinez"]],
    integrantes: [["Benjamin Cesar","Gamarra Dioses"],["Elard Jared","Bardales Saldaña"],["Ana Cecilia","Shuña Sangama"],["Dulce Luciana","García Rodríguez"],["Marcos","Magallanes Magallanes"],["Milena Dayana","Palacios Cruz"],["Gonzalo Rafael","Garcia Mujica"],["Heidi Saori","Casique Jimenez"],["Ruth Noemi","Casana Ccahuana"],["José David","Quevedo Torres"],["Andrea Jazmin","Bullon De La Cruz"],["Stephano","Pastor"]] },
  { nombre: "Compañía 2",
    coords: [["Anjely Nayeli","Tucto Perez"],["Jhonatan Smith","Arroyo Jimenez"]],
    integrantes: [["Yulissa Liset","Cedillo Torres"],["Alex","Valles Alava"],["Claudio Poalo","Armas Palacios"],["Dayana","Sinche"],["Aldo Fabrizio","Cedillo"],["Camila","Esteban Ortiz"],["Percy","Violeta"],["Fernando","Bonilla"],["Elizabeth","Calderon Gonzales"],["Megan Brianne O'Neil","Motta Navarro"],["Mera Joshua","Chiroque Carbajal"]] },
  { nombre: "Compañía 3",
    coords: [["Pedro Benjamin","Huaman Trujillo"],["Yulissa","Martines Ccasani"]],
    integrantes: [["Diego","Utia"],["Andrea","Trujillo Torres"],["Arianne","Berna Aroni"],["Jared","Atoche"],["Joel Enrique","Adrian Diestra"],["Linda Carol","Chacayan Jiménez"],["Fabrizio","Rosales Chavez"],["Jhenz Harold","Amasifuen Cordova"],["Araceli","Armas Palacios"],["Emma Nicolle","Romero Chacaliaza"],["Diego Armando","Poma Ramírez"]] },
  { nombre: "Compañía 4",
    coords: [["Ernesto Alonso","Cadillo Chavez"],["Leidy","Apeña"]],
    integrantes: [["Nayeli Erlit","Leon Soto"],["Cristian","García Valles"],["Cielo","Toscano"],["Milagros","La Torre Acho"],["Luis Enrique","Mendoza Ascón"],["José Miguel","Collahua Teran"],["Lidialinda","Bizarro Zapata"],["Dana","Villanueva"],["Brayan","Leon Soto"],["Fiorella Yaneth","Obregon Malaver"],["Giovanny Rosales","Rosales Chavez"],["Mauricio","Ramirez"]] }
];
/* ====================== DATOS:FIN ====================== */

// Paleta oficial FSY 2027 — familia cálida (Yellow 10, Yellow 20, Red 10, Yellow 30; extras: Sunshine, Red 5).
const PALETA_COMPANIAS = ['#FFB81C', '#F68D2E', '#FC4E6D', '#D45311', '#FFE48A', '#FDA1B2'];
const VOLUMEN = 0.5;

const PARTICULAS = ['de', 'del', 'la', 'las', 'los'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const px = v => Math.round(v) + 'px';

// "Primer nombre" grande + "Apellido paterno + inicial materna." pequeño.
function partes(nombres, apellidos) {
  const w = String(apellidos || '').trim().split(/\s+/).filter(Boolean);
  let i = 0; const out = [];
  while (i < w.length && PARTICULAS.includes(w[i].toLowerCase())) { out.push(w[i]); i++; }
  if (i < w.length) { out.push(w[i]); i++; }
  const ini = i < w.length ? w[i].charAt(0).toUpperCase() + '.' : '';
  const first = String(nombres || '').trim().split(/\s+/)[0] || '';
  return { first, last: out.join(' ') + (ini ? ' ' + ini : '') };
}

// Grilla adaptable según cantidad de integrantes (diseñada para 10–17, soporta 1–30+).
function grilla(n) {
  const cols = n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6;
  const rows = Math.max(1, Math.ceil(n / cols));
  const s = Math.min(1.12, 4 / cols, 3 / rows);
  return { cols, first: px(56 * s), last: px(Math.max(18, 26 * Math.sqrt(s))), gap: px(24 * s), pad: px(30 * s) };
}

function compania(i) {
  const d = COMPANIAS[i];
  const coords = (d.coords || []).map(([n, a]) => partes(n, a));
  const members = (d.integrantes || []).map(([n, a]) => partes(n, a));
  const cs = coords.length <= 2 ? 1 : 2 / coords.length + 0.1;
  return {
    num: i + 1, nombre: d.nombre || ('Compañía ' + (i + 1)),
    color: d.color || PALETA_COMPANIAS[i % PALETA_COMPANIAS.length],
    coords, members, g: grilla(members.length),
    cs: { first: px(88 * cs), last: px(36 * Math.min(1, cs + 0.1)), pad: px(40 * cs) }
  };
}

const scenes = [{ t: 'intro' }];
COMPANIAS.forEach((_, i) => { scenes.push({ t: 'coords', i }); scenes.push({ t: 'members', i }); });
scenes.push({ t: 'overview' });

function sIntro() {
  return `
  <div class="disc popdisc"><div class="fsy">FSY</div><div class="year">${esc(EVENTO.anio)}</div></div>
  <div class="intro-text">
    <div class="kicker rise" style="--d:.1s">${esc(EVENTO.zona)} · ${esc(EVENTO.sesion)}</div>
    <div class="intro-title rise" style="--d:.2s">Reparto de compañías</div>
    <div class="lema-row rise" style="--d:.4s"><div class="lema">${esc(EVENTO.lema)}</div><div class="cita">${esc(EVENTO.cita)}</div></div>
  </div>`;
}

function sCoords(i) {
  const c = compania(i);
  const cards = c.coords.length ? c.coords.map((p, k) => `
    <div class="coord-card rise" style="--d:${(0.45 + k * 0.15).toFixed(2)}s;padding:${c.cs.pad} 48px">
      <div class="ini" style="background:${c.color}">${esc(p.first.charAt(0))}</div>
      <div style="min-width:0"><div class="first" style="font-size:${c.cs.first}">${esc(p.first)}</div><div class="last" style="font-size:${c.cs.last}">${esc(p.last)}</div></div>
    </div>`).join('') : `<div class="coord-card empty rise" style="--d:.45s">Sin asignar todavía</div>`;
  return `
  <div class="panel slide" style="background:${c.color}">
    <div class="lbl fade" style="--d:.4s">Compañía</div>
    <div class="num rise" style="--d:.35s">${c.num}</div>
    <div class="sub fade" style="--d:.6s">de ${COMPANIAS.length} · ${c.members.length} integrantes</div>
  </div>
  <div class="coord-col">
    <div class="label-caps fade" style="--d:.4s">Coordinadores auxiliares</div>
    ${cards}
  </div>`;
}

function sMembers(i) {
  const c = compania(i), g = c.g;
  const cards = c.members.map((m, k) => `
    <div class="m-card pop" style="--d:${(0.3 + k * 0.05).toFixed(2)}s;padding-top:${g.pad};padding-bottom:${g.pad}">
      <div class="bar" style="background:${c.color}"></div>
      <div class="first" style="font-size:${g.first}">${esc(m.first)}</div>
      <div class="last" style="font-size:${g.last}">${esc(m.last)}</div>
    </div>`).join('');
  const chips = c.coords.length ? c.coords.map(p => `<div class="chip" style="background:${c.color}">${esc(p.first + ' ' + p.last)}</div>`).join('') : `<div class="chip" style="background:${c.color}">Sin asignar</div>`;
  return `
  <div class="members">
    <div class="m-head rise">
      <div class="left"><div class="badge" style="background:${c.color}">${c.num}</div><div class="m-title">${esc(c.nombre)}</div></div>
      <div class="pill-outline">${c.members.length} integrantes</div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(${g.cols},minmax(0,1fr));gap:${g.gap}">${cards}</div>
    <div class="m-foot fade" style="--d:1s"><b>Coordinadores:</b>${chips}</div>
  </div>`;
}

function sOverview() {
  const cards = COMPANIAS.map((_, i) => {
    const c = compania(i);
    const names = c.coords.length ? c.coords.map(p => `<div class="cn">${esc(p.first + ' ' + p.last)}</div>`).join('') : `<div class="cn">Sin asignar</div>`;
    return `<div class="ov-card rise" style="--d:${(0.2 + i * 0.12).toFixed(2)}s;background:${c.color}">
      <div class="top"><div class="num">${c.num}</div><div class="tot">${c.members.length + c.coords.length} personas</div></div>
      <div class="name">${esc(c.nombre)}</div>
      <div class="rule"></div>
      <div class="cl">Coordinadores</div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-top:10px">${names}</div>
    </div>`;
  }).join('');
  return `
  <div class="ov">
    <div class="ov-head rise"><div class="ov-title">Así quedaron las ${COMPANIAS.length} compañías</div><button class="btn" id="restart" type="button">↺ Ver de nuevo</button></div>
    <div class="ov-grid" style="grid-template-columns:repeat(${COMPANIAS.length},minmax(0,1fr))">${cards}</div>
  </div>`;
}

const stage = document.getElementById('stage');
const footer = document.getElementById('footer');
const dotsEl = document.getElementById('dots');
const posEl = document.getElementById('pos');
document.getElementById('evento').textContent = `FSY ${EVENTO.anio} · ${EVENTO.zona} · ${EVENTO.sesion}`;
dotsEl.innerHTML = scenes.map(() => '<i></i>').join('');

let idx = 0, current = null;
function render() {
  const s = scenes[idx];
  const html = s.t === 'intro' ? sIntro() : s.t === 'coords' ? sCoords(s.i) : s.t === 'members' ? sMembers(s.i) : sOverview();
  const el = document.createElement('div');
  el.className = 'scene';
  el.dataset.screenLabel = s.t;
  el.innerHTML = html;
  if (current) { const old = current; old.classList.add('leaving'); setTimeout(() => old.remove(), 450); }
  stage.insertBefore(el, footer);
  current = el;
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === idx));
  posEl.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(scenes.length).padStart(2, '0');
}
function go(d) { const n = Math.max(0, Math.min(scenes.length - 1, idx + d)); if (n !== idx) { idx = n; render(); } }

function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

// Música de fondo: arranca con la primera interacción (política de autoplay del navegador).
const bgm = document.getElementById('bgm');
const soundBtn = document.getElementById('sound');
const soundLbl = document.getElementById('soundLbl');
let muted = false, fadeT = null;
function fadeTo(target, ms, done) {
  clearInterval(fadeT);
  const start = bgm.volume, t0 = performance.now();
  fadeT = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    bgm.volume = start + (target - start) * k;
    if (k === 1) { clearInterval(fadeT); done && done(); }
  }, 30);
}
function syncSound() { const on = !bgm.paused && !muted; soundBtn.classList.toggle('playing', on); soundLbl.textContent = on ? 'Música' : 'Silencio'; }
function startMusic() {
  if (muted || !bgm.paused) return;
  bgm.volume = 0;
  bgm.play().then(() => { fadeTo(VOLUMEN, 2500); syncSound(); }).catch(() => {});
}
function toggleMusic() {
  if (!bgm.paused && !muted) { muted = true; fadeTo(0, 600, () => { bgm.pause(); syncSound(); }); }
  else { muted = false; startMusic(); }
  syncSound();
}
bgm.addEventListener('play', syncSound); bgm.addEventListener('pause', syncSound);
startMusic();

soundBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });
stage.addEventListener('click', e => {
  if (e.target.closest('#restart')) { idx = 0; render(); return; }
  startMusic();
  if (scenes[idx].t !== 'overview') go(1);
});
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); startMusic(); go(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === 'Home') { idx = 0; render(); }
  else if (k === 'End') { idx = scenes.length - 1; render(); }
  else if (k === 'm' || k === 'M') toggleMusic();
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
});

render();
</script>
</body>
</html>
